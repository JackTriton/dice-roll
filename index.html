<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe6" />
    <meta
      name="description"
      content="転がして、全部1に。サイコロのスライドパズルのタイムアタック。 / Roll every die to show 1 — a dice sliding puzzle time attack."
    />
    <!-- SNS のリンクプレビュー。X などは画像とページを完全な URL で書かないと読まないので、
         公開先の URL(VITE_SITE_URL、末尾は /)をビルド時に差し込む -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:title" content="サイコロ8パズル / Dice Roll 8" />
    <meta property="og:description" content="転がして、全部1に。 Roll every die to show 1." />
    <meta property="og:image" content="%VITE_SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="全部1になったサイコロの盤と「サイコロ8パズル」の題名" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="サイコロ8パズル / Dice Roll 8" />
    <meta name="twitter:description" content="転がして、全部1に。 Roll every die to show 1." />
    <meta name="twitter:image" content="%VITE_SITE_URL%og.png" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>サイコロ8パズル</title>
  </head>
  <body>
    <div id="app">
      <!-- タイトル -->
      <section id="screen-title" class="screen">
        <div class="title-hero">
          <canvas id="title-dice" class="title-dice" aria-hidden="true"></canvas>
          <h1 data-i18n="appName">サイコロ8パズル</h1>
          <p class="tagline" id="tagline" data-i18n="tagline">転がして、全部1に。</p>
        </div>
        <div class="size-select" role="radiogroup">
          <button type="button" role="radio" data-size="3" data-i18n="size3">3×3(8個)</button>
          <button type="button" role="radio" data-size="4" data-i18n="size4">4×4(15個)</button>
        </div>
        <!-- ルールの選択(ハードを出していない版では隠す) -->
        <div class="rule-select" role="radiogroup" id="rule-select" hidden>
          <button type="button" role="radio" data-rule="ones">
            <strong data-i18n="ruleOnes">ふつう</strong>
            <span data-i18n="ruleOnesNote">全部1に</span>
          </button>
          <button type="button" role="radio" data-rule="aligned">
            <strong data-i18n="ruleAligned">ハード</strong>
            <span data-i18n="ruleAlignedNote">正立にそろえる</span>
          </button>
        </div>
        <button type="button" id="btn-start" class="btn primary big" data-i18n="start">スタート</button>
        <dl class="stats" id="title-stats">
          <div>
            <dt data-i18n="best">ベスト</dt>
            <dd id="stat-best">—</dd>
          </div>
          <div>
            <dt data-i18n="ao5">5回平均</dt>
            <dd id="stat-ao5">—</dd>
          </div>
          <div>
            <dt data-i18n="solves">解いた回数</dt>
            <dd id="stat-count">0</dd>
          </div>
        </dl>
        <p class="note" id="title-note" hidden></p>
        <nav class="title-links">
          <button type="button" class="btn ghost" id="btn-howto" data-i18n="howto">遊び方</button>
          <button type="button" class="btn ghost" id="btn-ranking" data-i18n="ranking">ランキング</button>
          <button type="button" class="btn ghost" id="btn-settings" data-i18n="settings">設定</button>
        </nav>
      </section>

      <!-- プレイ -->
      <section id="screen-play" class="screen" hidden>
        <header class="play-bar">
          <button type="button" class="btn small ghost" id="btn-retire" data-i18n="retire">やめる</button>
          <span class="badge" id="play-mode"></span>
          <span class="play-size" id="play-size"></span>
        </header>
        <div class="timer" id="timer">0.00</div>
        <div class="play-sub"><span id="play-moves">0手</span></div>
        <p class="play-hint" id="play-hint"></p>
        <div class="board-wrap" id="board-wrap">
          <canvas id="board" class="board"></canvas>
        </div>
        <div class="tutorial-bar" id="tutorial-bar" hidden>
          <button type="button" class="btn small ghost" id="btn-tut-retry" data-i18n="retry">やり直す</button>
          <button type="button" class="btn small ghost" id="btn-tut-answer" data-i18n="showAnswer">
            答えを見る
          </button>
          <button type="button" class="btn small" id="btn-tut-next" data-i18n="next" hidden>次へ</button>
          <button type="button" class="btn small ghost" id="btn-tut-skip" data-i18n="skipTutorial">
            とばす
          </button>
        </div>

        <div class="result" id="result" hidden>
          <div class="result-card" role="dialog" aria-modal="true" aria-labelledby="result-title">
            <h2 id="result-title" data-i18n="solved">クリア!</h2>
            <p class="result-time" id="result-time"></p>
            <p class="result-detail" id="result-detail"></p>
            <p class="result-flag" id="result-flag" hidden></p>
            <p class="result-rank" id="result-rank" hidden></p>
            <p class="note" id="result-note" hidden></p>
            <form class="nick-form" id="nick-form" hidden>
              <label for="nick-input" data-i18n="nicknamePrompt">ランキングに載せますか?</label>
              <input
                id="nick-input"
                maxlength="24"
                autocomplete="nickname"
                data-i18n-placeholder="nicknamePlaceholder"
              />
              <div class="row">
                <button type="submit" class="btn primary small" data-i18n="submit">載せる</button>
                <button type="button" class="btn ghost small" id="btn-nick-skip" data-i18n="skip">
                  載せない
                </button>
              </div>
            </form>
            <div class="result-actions">
              <button type="button" class="btn primary" id="btn-again" data-i18n="again">もう一度</button>
              <button type="button" class="btn" id="btn-share" data-i18n="share">共有</button>
              <button type="button" class="btn" id="btn-replay" data-i18n="replay">リプレイ</button>
              <button type="button" class="btn" id="btn-video" data-i18n="saveVideo">動画を保存</button>
              <button type="button" class="btn ghost" id="btn-to-title" data-i18n="toTitle">
                タイトルへ
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- リプレイ -->
      <section id="screen-replay" class="screen" hidden>
        <header class="page-bar">
          <button type="button" class="btn small ghost" id="btn-replay-back" data-i18n="back">戻る</button>
          <h2 data-i18n="replay">リプレイ</h2>
          <span></span>
        </header>
        <p class="note admin-info" id="replay-info" hidden></p>
        <canvas id="replay-canvas" class="replay-canvas"></canvas>
        <div class="row center">
          <button type="button" class="btn" id="btn-replay-again" data-i18n="replay">リプレイ</button>
          <button type="button" class="btn" id="btn-replay-video" data-i18n="saveVideo">動画を保存</button>
        </div>
      </section>

      <!-- ランキング -->
      <section id="screen-ranking" class="screen" hidden>
        <header class="page-bar">
          <button type="button" class="btn small ghost" id="btn-ranking-back" data-i18n="back">戻る</button>
          <h2 data-i18n="rankingTitle">ランキング</h2>
          <span></span>
        </header>
        <div class="size-select" role="tablist" id="ranking-tabs">
          <button type="button" role="tab" data-size="3" data-i18n="sizeShort3">3×3</button>
          <button type="button" role="tab" data-size="4" data-i18n="sizeShort4">4×4</button>
        </div>
        <!-- ルールの切り替え(ハードを出していない版では隠す) -->
        <div class="size-select" role="tablist" id="ranking-rules" hidden>
          <button type="button" role="tab" data-rule="ones" data-i18n="ruleOnes">ふつう</button>
          <button type="button" role="tab" data-rule="aligned" data-i18n="ruleAligned">ハード</button>
        </div>
        <p class="note" id="ranking-me"></p>
        <p class="note" id="ranking-rule" data-i18n="rankingNoSolver"></p>
        <ol class="ranking-list" id="ranking-list"></ol>
        <p class="note" id="ranking-status" hidden></p>
      </section>

      <!-- 遊び方 -->
      <section id="screen-howto" class="screen" hidden>
        <header class="page-bar">
          <button type="button" class="btn small ghost" id="btn-howto-back" data-i18n="back">戻る</button>
          <h2 data-i18n="howtoTitle">遊び方</h2>
          <span></span>
        </header>
        <canvas id="howto-demo" class="howto-demo" aria-hidden="true"></canvas>
        <ol class="rules">
          <li id="rule-1" data-i18n="rule1"></li>
          <li data-i18n="rule2"></li>
          <li data-i18n="rule3"></li>
          <li data-i18n="rule4"></li>
          <li data-i18n="rule5"></li>
          <li id="rule-6" data-i18n="rule6"></li>
          <li data-i18n="rule7"></li>
        </ol>
        <button type="button" class="btn primary" id="btn-tutorial" data-i18n="tutorialStart">
          練習問題をやってみる
        </button>
        <section class="tips" aria-labelledby="tips-title">
          <h3 id="tips-title" data-i18n="tipsTitle">1個だけ揃っていないとき</h3>
          <p class="note" data-i18n="tipsNote"></p>
          <p class="note arrows-note"></p>
          <div class="size-select" role="tablist" id="tips-mode">
            <button type="button" role="tab" data-mode="solve" data-i18n="tipsModeSolve">
              そのまま揃える
            </button>
            <button type="button" role="tab" data-mode="return" data-i18n="tipsModeReturn">
              空きを真ん中に戻す
            </button>
          </div>
          <p class="note" id="tips-mode-note"></p>
          <div class="tips-grid" id="tips-grid"></div>
        </section>
        <!-- ハード(正立に揃える)の説明(ハードを出していない版では隠す) -->
        <section class="tips" id="hard-howto" aria-labelledby="hard-title" hidden>
          <h3 id="hard-title" data-i18n="hardTitle">ハード: 正立にそろえる</h3>
          <ol class="rules" id="hard-rules"></ol>
          <div class="hard-examples">
            <figure>
              <canvas id="hard-ex-near"></canvas>
              <figcaption data-i18n="hardNotYet">まだ(左の2個が横倒し)</figcaption>
            </figure>
            <figure>
              <canvas id="hard-ex-done"></canvas>
              <figcaption data-i18n="hardDone">クリア</figcaption>
            </figure>
          </div>
          <h4 data-i18n="hardTipsTitle">1は全部上で、向きだけがずれているとき</h4>
          <p class="note" data-i18n="hardTipsNote"></p>
          <p class="note arrows-note"></p>
          <div class="size-select" role="tablist" id="hard-tips-mode">
            <button type="button" role="tab" data-mode="solve" data-i18n="tipsModeSolve">
              そのまま揃える
            </button>
            <button type="button" role="tab" data-mode="return" data-i18n="tipsModeReturn">
              空きを真ん中に戻す
            </button>
          </div>
          <p class="note" id="hard-tips-mode-note"></p>
          <div class="tips-grid" id="hard-tips-grid"></div>
        </section>
      </section>

      <!-- 設定 -->
      <section id="screen-settings" class="screen" hidden>
        <header class="page-bar">
          <button type="button" class="btn small ghost" id="btn-settings-back" data-i18n="back">戻る</button>
          <h2 data-i18n="settingsTitle">設定</h2>
          <span></span>
        </header>
        <label class="field">
          <span data-i18n="language">言語</span>
          <select id="lang-select">
            <option value="ja">日本語</option>
            <option value="en">English</option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="control">操作</span>
          <select id="control-select">
            <option value="blank" data-i18n="controlBlank">空きマスを動かす</option>
            <option value="dice" data-i18n="controlDice">サイコロを動かす(これまでの操作)</option>
          </select>
          <span class="note" id="control-note"></span>
        </label>
        <form class="field" id="settings-nick-form">
          <span data-i18n="nickname">ニックネーム</span>
          <div class="row">
            <input
              id="settings-nick"
              maxlength="24"
              autocomplete="nickname"
              data-i18n-placeholder="nicknamePlaceholder"
            />
            <button type="submit" class="btn small" data-i18n="save">保存</button>
          </div>
          <span class="note" id="settings-nick-status"></span>
        </form>
        <!-- ハードのサイコロの見た目(案の見比べ用。開発用の版でだけ出す) -->
        <section class="field look-settings" id="look-settings" hidden>
          <span data-i18n="lookTitle">ハードの見た目(見比べ用)</span>
          <label class="row">
            <span data-i18n="lookSide">2の面の目印</span>
            <select id="look-side">
              <option value="bar" data-i18n="lookBar">青い線</option>
              <option value="band" data-i18n="lookBand">青い面</option>
              <option value="dots" data-i18n="lookDots">青い2の目</option>
              <option value="none" data-i18n="lookNone">なし</option>
            </select>
          </label>
          <label class="row">
            <span data-i18n="lookOne">1の図案</span>
            <select id="look-one">
              <option value="tri" data-i18n="lookOneTri">三角</option>
              <option value="koma" data-i18n="lookOneKoma">駒</option>
              <option value="fuji" data-i18n="lookOneFuji">赤富士</option>
              <option value="torii" data-i18n="lookOneTorii">鳥居</option>
              <option value="one" data-i18n="lookOneOne">数字の1</option>
              <option value="dial" data-i18n="lookOneDial">つまみ</option>
              <option value="dot" data-i18n="lookOneDot">丸(ふつう)</option>
            </select>
          </label>
          <canvas id="look-preview" class="look-preview" aria-hidden="true"></canvas>
        </section>
        <p class="note"><span data-i18n="deviceId">端末ID</span>: <code id="device-id"></code></p>
        <p class="note row">
          <span><span data-i18n="version">版</span>: <span id="app-version"></span></span>
          <button type="button" class="btn small ghost" id="btn-update-check" data-i18n="checkUpdate">
            最新版を確認
          </button>
          <span id="update-status" role="status"></span>
        </p>
        <button type="button" class="btn ghost" id="btn-reset" data-i18n="resetRecords">
          端末内の記録を消す
        </button>
      </section>

      <!-- 管理者画面(URL の末尾に #admin を付けて開く。文言は管理者向けなので日本語だけ) -->
      <section id="screen-admin" class="screen" hidden>
        <header class="page-bar">
          <button type="button" class="btn small ghost" id="btn-admin-back">戻る</button>
          <h2>管理者画面</h2>
          <button type="button" class="btn small ghost" id="btn-admin-logout" hidden>ログアウト</button>
        </header>
        <form class="field" id="admin-login" hidden>
          <span>管理用トークン</span>
          <div class="row">
            <input id="admin-token" type="password" autocomplete="off" />
            <button type="submit" class="btn small">入る</button>
          </div>
          <span class="note" id="admin-login-status"></span>
        </form>
        <div id="admin-body" class="admin-body" hidden>
          <div class="size-select" role="tablist" id="admin-tabs">
            <button type="button" role="tab" data-tab="ranking">ランキング</button>
            <button type="button" role="tab" data-tab="attempts">挑戦の一覧</button>
          </div>
          <div class="size-select" role="tablist" id="admin-sizes">
            <button type="button" role="tab" data-size="3">3×3</button>
            <button type="button" role="tab" data-size="4">4×4</button>
          </div>
          <!-- ルールの切り替え(ハードを出していない版では隠す) -->
          <div class="size-select" role="tablist" id="admin-rules" hidden>
            <button type="button" role="tab" data-rule="ones">ふつう</button>
            <button type="button" role="tab" data-rule="aligned">ハード</button>
          </div>
          <p class="note" id="admin-filter"></p>
          <ol class="admin-list" id="admin-list"></ol>
          <button type="button" class="btn ghost" id="btn-admin-more" hidden>もっと見る</button>
          <p class="note" id="admin-status"></p>
        </div>
      </section>

      <!-- 動画 -->
      <!-- 操作が変わったことの知らせ(これまでの版から使っている人に、一度だけ出す) -->
      <div class="result" id="control-dialog" hidden>
        <div class="result-card" role="dialog" aria-modal="true" aria-labelledby="control-dialog-title">
          <h2 id="control-dialog-title" data-i18n="controlNewTitle">操作が新しくなりました</h2>
          <p data-i18n="controlNewBody"></p>
          <div class="result-actions stacked">
            <button type="button" class="btn primary" id="btn-control-new" data-i18n="controlNewKeep">
              新しい操作で遊ぶ
            </button>
            <button type="button" class="btn" id="btn-control-old" data-i18n="controlNewBack">
              これまでの操作に戻す
            </button>
          </div>
        </div>
      </div>

      <div class="result" id="video-dialog" hidden>
        <div class="result-card" role="dialog" aria-modal="true" aria-labelledby="video-title">
          <h2 id="video-title" data-i18n="videoTitle">リプレイ動画</h2>
          <p id="video-message"></p>
          <progress id="video-progress" max="1" value="0" hidden></progress>
          <div class="result-actions" id="video-actions"></div>
        </div>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
